id: fund.valuation
version: 1.2.0
cn: 每日估值
kind: computed
category: fundamentals
priority: P0
description: 个股每日估值宽表（服务端物化 alt.valuation_daily，airflow
  pipeline.cn.valuation_daily 每日 17:05 物化（2026-11-24 起从 16:25 前移至引擎
  估值交付点后，起跑带就绪探针至 17:30；当日行常态当日可见，引擎延迟交付时
  回退 T-1）。每股每交易日一行，10 字段全部服务端现成口径直出，消费端零换算；
  **市值族与股本列同源**（total_mv = 当日不复权收盘 × 当日总股本），行内自洽。
  方案：docs/upstream-daily-basic-plan.md v3（2026-11-17 定稿）。
data_origin: [服务端物化（kline × 财报 × 股本事件 × 分红事件，公式同平台现算核）]
units:
  pe_ttm: 倍（MV ÷ NPTS_TTM，公告日 TTM）
  pb: 倍（MV ÷ 净资产，公告日时点前向填充）
  ps: 倍（MV ÷ TR_TTM）
  pr: 倍（PE_TTM ÷ ROE_TTM ÷ 100，市赚率）
  total_mv: 元（**当日**不复权收盘 × **当日**总股份，变更日含当日生效）
  circ_mv: 元（**当日**不复权收盘 × **当日**流通股份）
  turnover_rate: 小数（0.012 = 1.2%）
  dv_ttm: 小数（0.03 = 3%，DPS_TTM ÷ CLOSE）
  total_share: 股（当日总股本）
  float_share: 股（当日流通股本；上游披露口径「流通股份」恒等于「总股份」）
requires: {path: sys/valuation/init.xs, preloaded: true}
notes:
  - 可用性：仅 A 股（CN 专用表；HK/US 无流通股份源，诚实缺列不建表）
  - 数据自物化日起可用；历史回填由样本 DAG 提供（pe/pb/ps/pr ≤3y，引擎窗口硬顶；
    mv 族受 K 线单次读取上限约束，约 250 交易日内可逐日回算），更早区间诚实缺行
  - '**口径（2026-11-25 修正）**：市值族取「当日收盘 × 当日股本」，不随物化时刻的
    最新行情漂移。此前实现用 metric 层 `$MV_LAST` 一族（symbol 级缓存、恒为求值时
    刻 tip）配 `AT(锚日)`，会把 T 的市值写进 T-1 的行，事故修复还会造成整段冻结；
    修正后行内满足 `total_mv / total_share ≈ close`'
  - 行内缺失字段诚实缺列（不零填充）；亏损期 pe_ttm 缺行与平台现算口径一致
  - 'float_share 与 total_share 在上游披露口径中相等（披露项名为「流通股份」但
    实为总股本）；真实可流通口径为「无限售股份」，本表暂不落'
functions:
  - name: valuation.daily_basic
    cn: 个股每日估值序列
    kind: computed
    layer: L0
    params:
      - {name: sym, type: string, required: true, desc: 6 位裸码}
      - {name: begin, type: string, required: false, desc: 'ISO 起日（含），""=开区间'}
      - {name: end, type: string, required: false, desc: 'ISO 止日（含），""=开区间'}
      - {name: fields, type: array, required: false, desc: '字段子集 ARR，nil/空=全部 10 个'}
    returns: {desc: 'MAP 信封 {ok, as_of, data, meta}；data=长表 [{date, symbol, field, value}] 升序'}
    ranges:
      pe_ttm: [0, 3000]
      pb: [0, 200]
      ps: [0, 500]
      pr: [0, 2000]
      total_mv: [0, 5.0e+13]
      circ_mv: [0, 5.0e+13]
      turnover_rate: [0, 1]
      dv_ttm: [0, 0.5]
      total_share: [0, 1.0e+13]
      float_share: [0, 1.0e+13]
    example: 'valuation.daily_basic("600519", "2025-01-01", "", ARR{"pe_ttm", "total_mv"})'
    notes: [as_of = 表内最新行日期（与 begin/end 过滤无关，供调用方判新鲜度）；
      未知字段名在 meta.requested_unknown 里如实回报，不静默丢弃]
  - name: valuation.daily_basic_multi
    cn: 多票每日估值序列
    kind: computed
    layer: L0
    params:
      - {name: syms, type: array, required: true, desc: 标的清单 ARR（≥1）}
      - {name: begin, type: string, required: false, desc: 'ISO 起日（含），""=开区间'}
      - {name: end, type: string, required: false, desc: 'ISO 止日（含），""=开区间'}
      - {name: fields, type: array, required: false, desc: '字段子集 ARR，nil/空=全部 10 个'}
    returns: {desc: 'MAP 信封 {ok, as_of, data, meta}；data=多票长表 [{date, symbol, field, value}] 升序，meta.per_symbol 给每票 count/oldest_scanned/truncated'}
    ranges:
      pe_ttm: [0, 3000]
      pb: [0, 200]
      ps: [0, 500]
      pr: [0, 2000]
      total_mv: [0, 5.0e+13]
      circ_mv: [0, 5.0e+13]
      turnover_rate: [0, 1]
      dv_ttm: [0, 0.5]
      total_share: [0, 1.0e+13]
      float_share: [0, 1.0e+13]
    example: 'valuation.daily_basic_multi(ARR{"600519", "000001"}, "2026-11-01", "2026-11-18", ARR{"pe_ttm"})'
    notes: [行合同与 valuation.daily_basic 完全一致，可 concat 后按 symbol 分组；
      EC 仍按票计价（批量只省请求调度，不省算力），地板 ≈1,707 EC/票；
      单票读窗口 1,500 日文档，meta.per_symbol 各项的 truncated 标出被截断的票]

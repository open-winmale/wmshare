id: market.moneyflow
version: 1.1.0
cn: 资金流向
kind: raw
category: market
priority: P0
description: 个股日频资金流向（主力 / 超大单 / 大单 / 中单 / 小单净流入）、最新一行、
  全市场快照一次取数（board）。非 Level2 逐笔数据。
data_origin: [外部行情源]
units:
  net: 元（净流入金额）
  date: YYYY-MM-DD
requires: {path: sys/moneyflow/init.xs, preloaded: true}
notes:
  - 日频为 EOD 落库；query_last_live 为外部公开源当日读数（HTTP，短 TTL；非盘中行情）
  - 非 Level2：为单子分级聚合口径，非逐笔委托
  - query_last 上游返回单条 MAP 而非数组，XS normalizer 只吃数组；命中
    NotSupportedType:record 属上游返回形态问题，SDK 以 ServerError 透出且
    不重试、不静默转空，需要数组口径请用 query_bars(limit=1) / query_valid(limit=1)
functions:
  - name: moneyflow.query_bars
    cn: 资金流向历史
    kind: raw
    layer: L0
    params:
      - {name: sym, type: string, required: true, desc: 6 位裸码}
      - {name: limit, type: int, required: false, default: 20, desc: 根数，默认 20}
    returns: {desc: ARR · 资金流行（date/net_mf/elg_net/lg_net/md_net/sm_net）, shape_ref: inventory}
    example: 'moneyflow.query_bars("600519", 20)'
    normalize_with: moneyflow.fmt_maps
  - name: moneyflow.query_last
    cn: 最新资金流向
    kind: raw
    layer: L0
    params:
      - {name: sym, type: string, required: true}
    returns: {desc: 资金流行 MAP 或 nil, shape_ref: inventory}
    example: 'moneyflow.query_last("600519")'
    notes:
      - 上游返回单条 MAP 而非数组；XS normalizer 只吃数组，命中
        NotSupportedType:record 属上游返回形态问题，不是参数或凭证错误
      - SDK 以 ServerError 透出，不重试、不静默转空；需要数组口径请用
        moneyflow.query_bars(limit=1) 或 moneyflow.query_valid(limit=1)
  - name: moneyflow.query_valid
    cn: 有效资金流向（过滤空行）
    kind: raw
    layer: L0
    params:
      - {name: sym, type: string, required: true}
      - {name: limit, type: int, required: false, default: 20}
    returns: {desc: ARR · 资金流行}
    example: 'moneyflow.query_valid("600519", 20)'
  - name: moneyflow.query_last_live
    cn: 资金流当日读数（外部源）
    kind: raw
    layer: L0
    params:
      - {name: sym, type: string, required: true}
    returns: {desc: MAP · 资金流快照}
    example: 'moneyflow.query_last_live("000807")'
  - name: moneyflow.snapshot
    cn: 资金流向快照
    kind: raw
    layer: L0
    params:
      - {name: sym, type: string, required: true}
    returns: {desc: MAP · 快照}
    example: 'moneyflow.snapshot("600519")'
  - name: moneyflow.snapshot_net_mf
    cn: 最新主力净流入
    kind: raw
    layer: L0
    params:
      - {name: sym, type: string, required: true}
    returns: {desc: float · 主力净流入（元）}
    example: 'moneyflow.snapshot_net_mf("600519")'
  - name: moneyflow.board
    cn: 全市场资金流快照
    kind: raw
    layer: L0
    params: []
    returns: {desc: ARR · 资金流行（symbol/name/net_mf/net_mv_ratio/lg_net/elg_net/md_net/sm_net/industry，按主力净流入降序）, shape_ref: inventory}
    example: 'moneyflow.board()'
    notes:
      - 服务端索引一次取数（免逐票批量）
      - 日频 EOD 口径，非交易日数据不变；仅 A 股（不含停牌）
  # ---- L1：格式化 ----
  - {name: moneyflow.fmt_maps, cn: 资金流行规范化, kind: raw, layer: L1}
  - {name: moneyflow.fmt_lines, cn: 资金流文本行, kind: raw, layer: L1}
  - {name: moneyflow.fmt_line, cn: 单条资金流文本, kind: raw, layer: L1}
  - {name: moneyflow.fmt_snapshot_line, cn: 资金流快照一行文本, kind: raw, layer: L1}

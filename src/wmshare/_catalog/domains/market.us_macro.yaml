id: market.us_macro
version: 1.0.0
cn: 美宏观
kind: raw
category: reference
priority: P2
description: 美国宏观序列（精选 88 条 × 11 主题，随上游日更/月更/季更落库）。
  读面是「主题树 → 检索 → 元信息 → 升序点序列」四件：单位随序列而变
  （Percent / Billions of Dollars / Thousands of Persons…），必须读
  `fred.series_meta().units` 再解读数值，本域**不提供统一单位声明**。
  与 market.macro 的区别：后者是国产宏观指标码（$CPI/$GDP 走 alt.bssaa 指标层、
  单位已归一），本域是美元口径的原始观测序列，两者数据源与口径都不同，勿混。
data_origin: [外部宏观数据源]
units:
  date: YYYY-MM-DD
requires: {path: sys/fred/init.xs, preloaded: true}
notes:
  - '序列在 `eco.macro / fred.LIST.{id}`，按原生频率切片落库（list[] 是该切片观测）；
    精选范围 = `xs/data/fred/topics.json` 的 11 主题 × 88 条，**不是**上游全量目录
    （约 85 万行），检索只在这 88 条内做——精选即产品口径，也避免万级扫描成本。'
  - '**单位随序列而变**，本域不声明统一量纲：GDP 是十亿美元（Billions of Dollars）、
    UNRATE 是百分数（Percent）、PAYEMS 是千人（Thousands of Persons）。跨序列
    比较前必须先读 `fred.series_meta(id).units`，否则量级必错。'
  - '**空值不是 0**：上游缺失记为 "."，落库为 nil，本域读面直接跳过该点（不补 0、
    不插值）。需要原始文本时用 web 侧 `fred.series`（本域标 internal 未暴露）。'
  - '**需授权序列永不抓取**：`status=pre_approval_required` 的序列在上游即被粘住
    （版权限制），`series_meta` 如实返回该状态且 `has_data=false`，不会自动补数。'
  - '引用要求：数据来自圣路易斯联储 FRED，对外引用需保留 `citation` 字段原文。'
  - '点序列 `date` 升序（旧→新，全库合同）；窗口用 `begin/end` 下推，服务端按
    `startTs/endTs` 过滤，不全量取回再筛。'
functions:
  - name: fred.topics
    cn: 精选主题树
    kind: raw
    layer: L0
    params: []
    returns:
      desc: ARR · 主题行（topic/name/series）；11 主题合计 88 条序列
      shape_ref: inventory
    example: 'fred.topics()'
    notes:
      - '静态包直读（`xs/data/fred/topics.json`），**零 store 成本**——不知道有哪些 序列时先调它，再按主题取点，避免盲目试 id。'
  - name: fred.search
    cn: 精选序列检索
    kind: raw
    layer: L0
    params:
      - {name: keyword, type: string, required: true, desc: 关键词（匹配序列 id / 中文名 / 一句话说明；空串返回全部精选）}
      - {name: limit, type: int, required: false, desc: 返回条数，缺省 20，上限 88}
    returns:
      desc: ARR · 命中行（id/title_zh/blurb_zh/topic）
      shape_ref: inventory
    example: 'fred.search("GDP", 10)'
    notes:
      - '只在 88 条精选内匹配，不扫上游全量目录（约 85 万行）——成本差三个数量级。'
      - '中文关键词可命中（按精选中文名与说明匹配），不必先知道英文 id。'
  - name: fred.series_meta
    cn: 序列元信息
    kind: raw
    layer: L0
    params:
      - {name: id, type: string, required: true, desc: 序列 id（如 GDP、UNRATE、DGS10；大写，自动归一）}
    returns:
      desc: MAP · 元信息（id/title/title_zh/blurb_zh/units/frequency_short/release_name/status/has_data/series_url/citation/hint）
      shape_ref: inventory
    example: 'fred.series_meta("GDP")'
    notes:
      - '**先读 units 再解读数值**——这是本域唯一的口径来源（GDP 十亿美元、 UNRATE 百分数、PAYEMS 千人）。'
      - '`has_data=false` 表示库里还没有该序列观测（未抓取或需授权），不是「值为 0」。'
      - '不返回点序列（避免元信息面拉全历史）；点走 fred.points_asc。'
  - name: fred.points_asc
    cn: 序列点（date 升序）
    kind: raw
    layer: L0
    params:
      - {name: id, type: string, required: true, desc: 序列 id（如 GDP、UNRATE、DGS10）}
      - {name: begin, type: string, required: false, desc: 开始日期 YYYY-MM-DD（可空=全历史）}
      - {name: end, type: string, required: false, desc: 结束日期 YYYY-MM-DD（可空）}
      - {name: limit, type: int, required: false, desc: 根数，缺省 500（Client 单次上限），服务端上限 20000}
    returns:
      desc: ARR · 点（id/date/value；date 升序，空值已跳过）
      shape_ref: inventory
    example: 'fred.points_asc("GDP", "", "", 200)'
    ranges:
      value: [-1000000000, 10000000000000]
    checks: [date_iso]
    notes:
      - 'date 升序（旧→新，全库合同）+ 纯 ISO 日期。web 侧的 `fred.series` 是 另一套契约（新→旧、行内 year 是期间码），本域不用它。'
      - '空值跳过不补 0：上游 "." 记为 nil，直接不出该点（不是 0）。'
      - '数据版本键缓存（最新观测日期入键）：同一序列复跑近零成本，新观测落库自动换键。'
      - 'ranges 的 value 界是**跨序列宽界**（只拦量级灾难）：88 条序列单位各异 （百分数到万亿美元），真实量级以 series_meta 的 units 为准。'
  # ---- L1：web 页面生产读面（新→旧 + 期间码 year），不进 SDK 门面 ----
  - {name: fred.points, cn: 折线点（web 读面，新→旧）, kind: raw, layer: L1, internal: true}
  - {name: fred.series, cn: 已入库包（web 读面）, kind: raw, layer: L1, internal: true}

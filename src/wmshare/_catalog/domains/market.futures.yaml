id: market.futures
version: 1.2.0
cn: 期货
kind: raw
category: market
priority: P1
description: 国内期货辅助读面。主力连续行情经 `futures.query_bars`（store 直读，
  cli.futures.get / snapshot / bars）或 FUT 前缀指标码 + `fut_symbol`（eval 点读）；
  本域目录函数提供**换月映射**——主力连续码 → 当日实际合约（换月追踪，随日线日更）
  ——以及**主力连续历史 K 线 store 直读**（全历史一次取，含结算/持仓字段）。
data_origin: [外部行情源]
units:
  date: YYYY-MM-DD
requires: {path: sys/futures/init.xs, preloaded: true}
notes:
  - 主力连续码形如 "RB.SHF"（品种.交易所）；82 品种（74 商品 + 8 金融）见
    cli.futures.snapshot 的品种寻址；外盘键形如 "global.CL"（仅日线有数据）
  - 门面统一走 `futures.query_bars`（store 直读：日频只含交易日、最新一根随上游
    日更、同数据版本复跑近零成本）；FUT 前缀标量 eval 会继承 A 股锚点的报告期
    上下文（锚到锚点股最新财报期末），只适合显式 cursor 点读
  - 映射行不可变（换月历史固定），fmt_maps 结果按行指纹缓存（36a5de20 范式）
  - 周/月线是上游周期 bar（上游周/月线原样直存，成交量为周期合计），SDK 不做
    二次聚合；外盘周/月线上游未提供（返回空）
  - 成本：query_bars 按行计费（≈190+126 EC/行 冷、同日复跑版本键缓存 ≈135 EC）；
    mapping 全历史冷 ≈21 万 EC，建议传 begin/end 收窄窗口
functions:
  - name: futures.mapping
    cn: 主力换月映射
    kind: raw
    layer: L0
    params:
      - {name: sym, type: string, required: true, desc: 主力连续码（品种.交易所，如 RB.SHF）}
      - {name: begin, type: string, required: false, desc: 开始日期 YYYY-MM-DD（可空=全历史）}
      - {name: end, type: string, required: false, desc: 结束日期 YYYY-MM-DD（可空）}
    returns:
      desc: ARR · 映射行（date 升序；换月事件≈每年 4-6 次）
      shape:
        kind: array
        cn: 换月映射行
        items:
          kind: object
          cn: 映射行
          fields:
            - {name: date, type: string, cn: 交易日}
            - {name: symbol, type: string, cn: 主力连续码（品种.交易所）}
            - {name: mapping_symbol, type: string, cn: 当日实际合约}
    example: 'futures.mapping("RB.SHF", "2026-11-01", "2026-11-18")'
    normalize_with: futures.fmt_maps
  - name: futures.query_bars
    cn: 主力连续历史 K 线（store 直读）
    kind: raw
    layer: L0
    params:
      - {name: sym, type: string, required: true, desc: 主力连续码（品种.交易所，如 RB.SHF；自动补 cn. 前缀；郑商所后缀 .ZCE；外盘用 global.CL）}
      - {name: begin, type: string, required: false, desc: 开始日期 YYYY-MM-DD（可空=全历史；含）}
      - {name: end, type: string, required: false, desc: 结束日期 YYYY-MM-DD（可空；**开区间**，要含当日请传次日）}
      - {name: limit, type: int, required: false, desc: 根数，缺省取满（日 5500/周 1200/月 360）}
      - {name: period, type: string, required: false, default: D, desc: 周期 D/W/M（也收 day/week/month）}
    returns:
      desc: ARR · bars（date 升序；date/symbol/open/high/low/close/settle/pre_settle/volume/amount/oi/oi_chg/percent）
      shape_ref: inventory
    example: 'futures.query_bars("RB.SHF", "", "", 250, "D")'
    ranges:
      percent: [-1, 1]
      volume: [0, 1.0e+8]
      oi: [0, 1.0e+8]
      oi_chg: [-1.0e+8, 1.0e+8]
      amount: [0, 1.0e+13]
    checks: [date_iso]
    notes:
      - 与 cli.futures.bars 分工：门面=本函数的归一化封装（date 换周期起点、
        金额万元、补齐 sas）；本函数=原始行（date=交易日、金额=元、含 percent）
      - 郑商所后缀 .ZCE（store 键系），与门面 czce 系口径不同；量/持仓=手、额=元、
        percent=小数（对前结算）——期货原生单位，不做 SDK 单位换算
      - begin 含、end 为开区间（实测 begin=09-01/end=09-30 不含 09-30）
      - 数据版本键缓存（最新日 K 日期入键）：同日复跑近零成本，跨日自动取到新 bar
      - 外盘 global.* 同样可读，但上游仅日线有数据（周/月为空）
  - name: futures.receipts
    cn: 交易所仓单快照（按业务月）
    kind: raw
    layer: L0
    params:
      - {name: month, type: string, required: false, desc: 业务月 YYYYMM 或 YYYY-MM（空=最新月）}
    ranges:
      qty: [-1.0e+9, 1.0e+9]
      change: [-1.0e+9, 1.0e+9]
    returns:
      desc: ARR · 仓单行（按 title 升序）
      shape:
        kind: array
        cn: 仓单行
        items:
          kind: object
          cn: 仓单行
          fields:
            - {name: period, type: string, cn: 快照日期（ISO）}
            - {name: title, type: string, cn: "{exchange}.{code} 去重键"}
            - {name: exchange, type: string, cn: 交易所 SHFE/CZCE/GFEX}
            - {name: variety_code, type: string, cn: 品种代码（上游原文，SHFE 为中文名）}
            - {name: variety_name, type: string, cn: 品种名称}
            - {name: qty, type: float64, cn: 仓单量（单位见 unit 字段）}
            - {name: change, type: float64, cn: 较上一交易日增减}
            - {name: unit, type: string, cn: 单位（吨/张，逐行）}
            - {name: source_url, type: string, cn: 来源页}
    example: 'futures.receipts("202611")'
    notes:
      - "非逐日历史：上游按业务月 REPLACE 写入，只保留当月最后一次抓取那天的快照
        （2026-11-24 实测：202610=10-30、202611=11-23，各 61 个品种）；逐日序列需上游改按日分档"
      - 覆盖 SHFE/CZCE/GFEX 三所；DCE 反爬未采（上游如实排除）
      - 仓单量口径=交易所披露的注册仓单量（吨/张逐行），不是成交量/持仓量
  - {name: futures.receipts_latest, cn: 最新仓单快照, kind: raw, layer: L1, internal: true}
  - {name: futures.receipts_months, cn: 仓单可用月份, kind: raw, layer: L1, internal: true}
  - name: futures.holding
    cn: 期货每日持仓排名（按合约查会员排名）
    kind: raw
    layer: L0
    params:
      - {name: date, type: string, required: false, desc: 交易日 YYYYMMDD 或 YYYY-MM-DD（空=最新交易日）}
      - {name: contract, type: string, required: false, desc: 合约代码（如 A2701）；空=全市场按上游顺序截 limit}
      - {name: limit, type: int, required: false, desc: 返回行数上限（默认 200）；给 contract 时按成交量降序取前 limit}
    ranges:
      vol: [0, 1.0e+7]
      vol_chg: [-1.0e+7, 1.0e+7]
      long_hld: [0, 1.0e+7]
      long_chg: [-1.0e+7, 1.0e+7]
      short_hld: [0, 1.0e+7]
      short_chg: [-1.0e+7, 1.0e+7]
    returns:
      desc: ARR · 持仓行（给 contract 时按 vol 降序；不给时上游顺序）
      shape:
        kind: array
        cn: 持仓排名行
        items:
          kind: object
          cn: 持仓排名行
          fields:
            - {name: date, type: string, cn: 交易日 YYYYMMDD}
            - {name: contract, type: string, cn: 合约代码（上游 symbol）}
            - {name: broker, type: string, cn: 期货公司会员}
            - {name: vol, type: float64, cn: 成交量（手/张，上游原值）}
            - {name: vol_chg, type: float64, cn: 成交量增减}
            - {name: long_hld, type: float64, cn: 多头持仓}
            - {name: long_chg, type: float64, cn: 多头持仓增减}
            - {name: short_hld, type: float64, cn: 空头持仓}
            - {name: short_chg, type: float64, cn: 空头持仓增减}
    example: 'futures.holding("", "A2701", 20)'
    notes:
      - 上游期货持仓排名接口，按交易日一档（单日约 1 万行）；上游单次 4000 行已分页拉满
      - 量=手/张（随交易所惯例，不做换算）；vol_chg 等增减可负
      - 成本：先在原始行层按合约过滤/截断再规范化（单日全量规范化约 121 万 EC，按合约查询约数百 EC）
      - 不给 contract 时不做跨合约成交量排序（1 万行 SORTBY 会放大 EC 数百倍），按上游顺序截前 limit
  - name: futures.settle
    cn: 期货每日结算参数
    kind: raw
    layer: L0
    params:
      - {name: date, type: string, required: false, desc: 交易日 YYYYMMDD 或 YYYY-MM-DD（空=最新交易日）}
      - {name: contract, type: string, required: false, desc: 合约代码（如 CU2612.SHF）或品种前缀（如 CU）；空=全市场}
    ranges:
      settle: [0, 1.0e+7]
      fee_rate: [0, 100]
      fee: [0, 1.0e+5]
      delivery_fee: [0, 1.0e+5]
      b_hedge_margin_rate: [0, 100]
      s_hedge_margin_rate: [0, 100]
      long_margin_rate: [0, 100]
      short_margin_rate: [0, 100]
    returns:
      desc: ARR · 结算行（contract 升序）
      shape:
        kind: array
        cn: 结算参数行
        items:
          kind: object
          cn: 结算参数行
          fields:
            - {name: date, type: string, cn: 交易日 YYYYMMDD}
            - {name: contract, type: string, cn: 合约代码（如 CU2612.SHF）}
            - {name: settle, type: float64, cn: 结算价（合约计价单位，随品种）}
            - {name: fee_rate, type: float64, cn: 交易手续费率（上游原值，‰ 口径）}
            - {name: fee, type: float64, cn: 交易手续费（元，上游原值）}
            - {name: delivery_fee, type: float64, cn: 交割手续费（元，上游原值）}
            - {name: b_hedge_margin_rate, type: float64, cn: 买套保保证金率（小数，0.1=10%）}
            - {name: s_hedge_margin_rate, type: float64, cn: 卖套保保证金率}
            - {name: long_margin_rate, type: float64, cn: 多头保证金率}
            - {name: short_margin_rate, type: float64, cn: 空头保证金率}
    example: 'futures.settle("", "CU")'
    notes:
      - 上游期货结算参数接口，按交易日一档（单日约 874 行）
      - "费率口径不统一：fee_rate 为 ‰ 原值；保证金率多为小数（0.11=11%），个别品种上游给 50（视为 50%），不做换算"
      - settle 价格单位随合约（元/吨、元/桶等），不是统一元；跨品种比较前先看合约单位
      - 成本：先在原始行层按合约代码前缀过滤再规范化（全量约 8.2 万 EC，前缀过滤后通常数十行）
  - {name: futures.holding_dates, cn: 持仓排名可用交易日, kind: raw, layer: L1, internal: true}
  - {name: futures.settle_dates, cn: 结算参数可用交易日, kind: raw, layer: L1, internal: true}
  # ---- L1：格式化 ----
  - {name: futures.fmt_maps, cn: 映射行规范化, kind: raw, layer: L1, internal: true}

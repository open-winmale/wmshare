id: fund.statements
version: 1.4.0
cn: 财务报表
kind: raw
category: fundamentals
priority: P0
description: 三大报表科目原值（资产负债 / 利润 / 现金流）多期透视与审计意见。
  数据源 = 全市场宽表 fin_income / fin_balance / fin_cashflow（季度粒度、披露原币）；
  列名为各市场披露科目原文，不做 CN 口径翻译。
data_origin: [混源宽表(vendor), 外部数据服务(主要指标)]
units:
  amount: 报表原币（CN=元，HK=港币，US=美元）
  ratio: 小数
  period: 报告期（年-采样，如 2024-Q4 / 2026-Q1）
requires: {path: sys/rptdom/init.xs, preloaded: false}
stores: [fin.balance, fin.income, fin.cashflow, fin.indicator]
notes:
  - domain 取值 fin.balance_sheet / fin.income_statement / fin.cashflow_statement
  - '可用性：mkt_statement 全市场 cn/hk/us——k=各市场披露科目原文
    （cn / HKFRS / USGAAP），披露原币，无派生行与溯源列，映射由消费侧
    负责；消费方以门面 cli.statements.* 编程、勿依赖底层函数名'
  - opts.n 期数（默认 5，1..10）；opts.sampling = Q4（缺省，年报档）|
    Q1..Q3（单季档）| Q（季报全档 Q4→Q1 逐档，vals 键 "2026:Q1" 形式，n 截
    总期数）；无母公司口径、无期间列举接口（v2 宽表无 listbs，latest
    doc.annual 锚定逐期取，缺期 nil 不填补）
  - statement_audit 仅 cn（混源 Q4 年轴，读 fin.balance 的 opinionType）
  - '内部提取库（alt.bssaa 的 rptdom_*.LIST，含合并/母公司、溯源列、目录树）
    不对外提供：statement/compare/tree/years/periods 已退对外目录，仅平台
    内部页面经 xs.require 消费'
functions:
  - name: rptdom.mkt_statement
    cn: 三大报表科目×期次透视（cn/hk/us 全市场宽表）
    kind: raw
    layer: L0
    params:
      - {name: sym, type: string, required: true, desc: 6 位裸码 / 港股 5 位 / 美股 ticker（自动路由市场）}
      - {name: domain, type: string, required: true, enum: [fin.balance_sheet, fin.income_statement, fin.cashflow_statement]}
      - {name: opts, type: object, required: false, desc: '{n: 期数(默认5,1..10), sampling: Q4(缺省年报档)|Q1..Q3 单季|Q 季报全档}'}
    returns: {desc: ARR · 科目行（k=披露科目原文 × 期次列，披露原币；缺期 nil 不填补）}
    example: 'rptdom.mkt_statement("600519", "fin.income_statement", {"n": 5})'
  - name: rptdom.statement_audit
    cn: 审计意见（混源，Q4 年轴；仅 cn）
    kind: raw
    layer: L0
    params:
      - {name: sym, type: string, required: true}
    returns: {desc: 'MAP · {年份: 审计意见}'}
    example: 'rptdom.statement_audit("600519")'

id: market.stocks
version: 1.2.0
cn: 证券与行业基础
kind: computed
category: market
priority: P1
description: 证券基础库——全市场证券列表（代码/名称/交易所/三级行业/上市日期/ST）、
  行业目录（申万 sw2021、恒生 hsi）、行业成分股（支持行业键/代码/中文名）、
  涨跌停价快照、ST/停复牌变动史。代码池与行业过滤的取数底座；行情/指标等按 symbol 走各自域。
data_origin: [平台数据服务]
units:
  flag: 布尔（is_st）
  date: YYYY-MM-DD（listed，档案缺失为空串）
requires: {path: sys/stocks/init.xs, preloaded: false}
notes:
  - '全表单次返回（cn≈5.7k / hk≈2.8k / us≈5.3k 行），排序不保证；SDK 侧可自行排序过滤'
  - 'cn/hk universe 随上游每日刷新；us universe 为手动 DAG 刷新，新上市/退市有滞后'
  - '上游 usall 含空 symbol 占位行，域库侧已剔除（us 5560→5337）；返回行数恒等有效标的数'
  - '美股：列表与个股行业码可用；行业目录树上游未灌数（手动灰度），industry_list 恒空、
    industry_members 不可用'
  - 'exchange 为小写交易所简称（sz/sh/bj/hk…），部分档案缺失为空串'
  - 'ST/停复牌史为 A 股专项：停复牌按交易日、简称变更按生效日；无上市/退市日期源，时间轴不含上市事件'
functions:
  - {name: stocks.query_list, cn: 全市场证券列表, layer: L0}
  - {name: stocks.industry_list, cn: 行业目录, layer: L0}
  - {name: stocks.industry_members, cn: 行业成分股, layer: L0}
  - name: stocks.limit_prices
    cn: 全市场涨跌停价（当日快照）
    kind: computed
    layer: L0
    ranges:
      close: [0, 1.0e+4]
      percent: [-2, 2]
      basis: [0, 1.0e+4]
      limit_up: [0, 1.0e+4]
      limit_down: [0, 1.0e+4]
    returns:
      desc: ARR · 涨跌停价行（非停牌全市场，按代码升序）
      shape:
        kind: array
        cn: 涨跌停价行（代码升序）
        items:
          kind: object
          cn: 涨跌停价行
          fields:
            - {name: symbol, type: string, cn: 6 位代码}
            - {name: name, type: string, cn: 证券简称}
            - {name: board, type: string, cn: 上市板块（交易所原文）}
            - {name: close, type: float64, cn: 最新价（元）}
            - {name: percent, type: float64, cn: 当日涨跌幅（小数）}
            - {name: basis, type: float64, cn: 前收盘（元，snap 到分）, optional: true}
            - {name: limit_up, type: float64, cn: 涨停价（元）, optional: true}
            - {name: limit_down, type: float64, cn: 跌停价（元）, optional: true}
            - {name: rule, type: string, cn: 规则标签 main10/gem20/star20/bse30/unbounded/delisting/no_price}
            - {name: is_st, type: bool, cn: 是否 ST}
    example: stocks.limit_prices()
    notes:
      - 当日快照（非历史序列）：索引一次投影，全市场冷 ≈14 万 EC、同日复跑 ≈75 EC
      - 带宽按代码号段：30x/68x=20%、43/83/87/88/92（北交所）=30%、其余=10%；ST 股按板块带宽（2026-11-23 全市场实测未见 5% 档）
      - 前收盘 = ROUND(close/(1+percent), 2)（A 股报价恒为分，snap 到分消除 percent 四位小数误差）；限价 ROUND 到分
      - rule=unbounded（当日涨跌幅超带宽 0.2 个百分点，如新股无涨跌幅日）/delisting（退市整理期）/no_price 时价格字段为 nil，不猜
      - 停牌股不返回；新股上市前 5 个交易日无涨跌停，索引未物化上市日期——快照按板块带宽给理论价，超带宽会被标 unbounded，其余次新股请用 listingdate 自查（已知边界）
  - name: stocks.limit_price
    cn: 单票涨跌停价（当日快照）
    kind: computed
    layer: L0
    params:
      - {name: sym, type: string, required: true, desc: 6 位裸码或带 .SH/.SZ/.BJ 后缀}
    ranges:
      close: [0, 1.0e+4]
      percent: [-2, 2]
      basis: [0, 1.0e+4]
      limit_up: [0, 1.0e+4]
      limit_down: [0, 1.0e+4]
    returns:
      desc: MAP · 涨跌停价行（字段同 stocks.limit_prices；未收录/停牌返回 nil）
    example: 'stocks.limit_price("600519")'
    notes:
      - 索引单票点查（≈30-50 EC），口径与全市场快照完全一致
  - name: stocks.suspend_history
    cn: 单票停复牌事件
    kind: computed
    layer: L0
    params:
      - {name: sym, type: string, required: true, desc: 6 位裸码或带 .SH/.SZ/.BJ 后缀}
      - {name: begin, type: string, required: false, default: '', desc: 起始日 YYYY-MM-DD（空=不限）}
      - {name: end, type: string, required: false, default: '', desc: 结束日 YYYY-MM-DD（空=不限）}
    returns:
      desc: ARR · 停复牌事件行（date 升序）
      shape:
        kind: array
        cn: 停复牌事件行
        items:
          kind: object
          cn: 停复牌事件
          fields:
            - {name: date, type: string, cn: 交易日}
            - {name: type, type: string, cn: 事件类型（S=停牌 / R=复牌）}
            - {name: timing, type: string, cn: 停牌时段说明, optional: true}
    checks: [date_iso]
    example: 'stocks.suspend_history("600519", "2026-01-01", "2026-11-23")'
    notes:
      - 停牌事件按交易日逐条（长停个股每天一行），区间查询默认上限 2000 条
      - 自 1999 年起的全量历史；日更采集自 2026-11 起（窗口回看 40 天）
  - name: stocks.name_history
    cn: 单票简称变更史
    kind: computed
    layer: L0
    params:
      - {name: sym, type: string, required: true, desc: 6 位裸码或带 .SH/.SZ/.BJ 后缀}
    returns:
      desc: ARR · 简称段行（按生效日升序）
      shape:
        kind: array
        cn: 简称段行
        items:
          kind: object
          cn: 简称段
          fields:
            - {name: name, type: string, cn: 证券简称}
            - {name: start_date, type: string, cn: 生效日}
            - {name: end_date, type: string, cn: 失效日（现用简称为空串）, optional: true}
            - {name: ann_date, type: string, cn: 公告日, optional: true}
            - {name: reason, type: string, cn: 变更原因原文, optional: true}
            - {name: is_st, type: bool, cn: 该简称段是否 ST（含 *ST/SST）}
    example: 'stocks.name_history("000001")'
    notes:
      - 简称段首尾相接（end_date=下一段生效日前一日）；is_st 由简称含 ST 判定
      - 只覆盖发生简称变更的进出，无变更的上市初期不在表内
  - name: stocks.lifecycle
    cn: 单票 ST/停复牌变动时间轴
    kind: computed
    layer: L0
    params:
      - {name: sym, type: string, required: true, desc: 6 位裸码或带 .SH/.SZ/.BJ 后缀}
    returns:
      desc: ARR · 时间轴事件行（date 升序）
      shape:
        kind: array
        cn: 时间轴事件行
        items:
          kind: object
          cn: 时间轴事件
          fields:
            - {name: date, type: string, cn: 日期（停复牌=交易日 / 简称=生效日）}
            - {name: kind, type: string, cn: 事件类型 rename/st_enter/st_exit/suspend/resume}
            - {name: detail, type: string, cn: 事件说明（简称或停牌时段；停复牌无时段为空串）}
    checks: [date_iso]
    example: 'stocks.lifecycle("000001")'
    notes:
      - 由 name_history + suspend_history 合并派生，日期升序；同一天多事件顺序不保证
      - st_exit 的日期=首个非 ST 简称的生效日；detail=新简称
      - 不含上市/退市事件（无历史日期源；当前状态看 stocks.query_list 的 is_st/listed）
      - 停复牌明细上限 2000 条（超长停牌史个股取前 2000 条）
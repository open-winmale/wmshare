name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    # 最小权限：CI 只读仓库，不写任何内容（无 token 泄露面）。
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      # 关掉 fail-fast：一个矩阵 job 红了不能取消其余 job，否则会掩盖
      # 其它 Python 版本的独立结论（历史上 3.10 长期标红时的观察盲区）。
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Leak gate (internal markers / secrets)
        run: python tools/check_leak.py
      - name: Catalog contract + anti-fabrication gate
        run: python tools/validate_catalog.py
      - name: Version consistency gate (six sources)
        run: python tools/check_version.py --check
      - name: License consistency gate (BSD-3-Clause)
        run: python tools/check_license.py --check
      - name: Guard coverage floor (no regression)
        run: python tools/guard_coverage.py --min 0.156
      - name: API docs drift gate
        run: python tools/gen_api_docs.py --check
      - name: Typed facade drift gate
        run: python tools/gen_typed_api.py --check
      - name: OpenAPI spec drift gate
        run: python tools/gen_openapi.py --check
      - name: llms.txt drift gate
        run: python tools/gen_llms.py --check
      - name: Indicators nav drift gate
        run: python tools/gen_indicators.py --check
      - name: server.json drift gate (generated from __version__)
        run: python tools/gen_server.py --check
      - name: Type check
        run: python -m mypy
      - name: Tests + coverage (offline; extractor drift auto-skips without scripts tree)
        # S5/M1：补测后实测综合覆盖 87.54%（行 89.63% / 分支 82.28%），
        # --cov-fail-under 比较的是综合率；此前 83.71% 会击穿 85 门槛。
        # 纯分支率仍未到 85，若要单独锁分支率需另加 coverage json 判定。
        # ratchet 由 tests/test_coverage_policy.py 校验 run 命令本身。
        run: pytest -q --cov=wmshare --cov-branch --cov-report=term-missing --cov-fail-under=85
      - name: Wheel build + clean install smoke (3.11 only)
        if: matrix.python == '3.11'
        run: |
          python -m pip wheel . --no-deps -w /tmp/wmshare-wheel
          python -m venv /tmp/wmshare-venv
          /tmp/wmshare-venv/bin/pip install /tmp/wmshare-wheel/*.whl
          /tmp/wmshare-venv/bin/python -c "import wmshare; c=wmshare.load(); s=c.stats(); assert s['domains'] >= 18 and s['functions'] >= 260 and s['metric_catalog_total'] >= 2700"
          /tmp/wmshare-venv/bin/python examples/02_catalog_tour.py > /tmp/catalog_tour.out
          grep -q "数据域：" /tmp/catalog_tour.out
      - name: Dependency vulnerability scan (pip-audit)
        # 供应链漏洞扫描：优先审计 hash 锁文件（requirements-dev.lock），
        # 缺锁文件时回退扫描已装 dev 环境。豁免判定见下方过滤脚本
        # （JSON 输出 + 包/版本过滤，不用 --ignore-vuln：同一漏洞存在
        # PYSEC/GHSA/CVE 多源别名，逐 ID 枚举会被别名击穿）。
        run: |
          python -m pip install pip-audit
          # 3.10/3.11 解释器 ensurepip 捆绑的 setuptools 79.0.1 命中已披露
          # 通告（修复版 84.1.0，仍支持 >=3.10）；3.12+ 已不捆绑，升级对全腿无害。
          python -m pip install -U "setuptools>=84.1.0"
          if [ -f requirements-dev.lock ]; then
            python -m pip install -r requirements-dev.lock
          fi
          python -m pip_audit -f json > /tmp/pip_audit.json || true
          python - "${{ matrix.python }}" <<'EOF'
          import json, sys
          leg = sys.argv[1]
          data = json.load(open("/tmp/pip_audit.json"))
          bad = []
          for dep in data.get("dependencies", []):
              name, ver = dep.get("name", "").lower(), dep.get("version", "")
              for v in dep.get("vulns", []):
                  # pillow 13.0.0（修复版）起弃用 3.10，12.x 是 3.10 的最后支持线，
                  # 该批通告无法以升级消除——3.10 腿按包+版本整批豁免；
                  # 3.10 移出支持矩阵（pyproject requires-python）时同步删除。
                  if leg == "3.10" and name == "pillow" and ver.startswith("12."):
                      continue
                  bad.append(f"{name}=={ver}  {v.get('id')}  fix={v.get('fix_versions')}")
          if bad:
              print(f"FAIL: {leg} 腿发现未豁免的已知漏洞：")
              for b in bad:
                  print("  -", b)
              sys.exit(1)
          print(f"pip-audit ok（{leg} 腿无未豁免漏洞）")
          EOF

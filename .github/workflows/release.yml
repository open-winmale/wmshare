name: release

# 每个 v* tag 自动建一条 GitHub Release，正文直接抽 CHANGELOG 对应版本段，
# 并在 Release 成功后把 sdist/wheel 发布到 PyPI（需要 repo Secret `PYPI_TOKEN`）。
# 起因：13 个 tag 名下只有 1 个 Release（v1.10.0），Watch → Releases 这条追更
# 通道是断的——关注仓库的人收不到任何新版本通知；PyPI 也曾长期靠手工 twine，
# 出过 GitHub 已发 3 个版本而 PyPI 停在旧版的错位。
#
# 设计约束：
#   * tag 与 src/wmshare/__init__.py::__version__ 不一致就别发（防止打错 tag）；
#   * 不引入第三方 action（softprops/action-gh-release 之类），只用 gh CLI 与
#     pip 安装的 build/twine，保持供应链面最小；
#   * 正文抽不到 → 整个 job 失败，绝不发一条没有说明的 Release；
#   * **质量门禁前置到 gates job，先于 Release 与 PyPI 两步**（2026-11-19 加）：
#     此前 release.yml 只做版本互校 + twine check，不跑任何测试/契约检查，
#     于是 1.21.0 把指向已下线底层函数的 statements 门面直接发上了 PyPI，次日
#     才出 1.21.1 补丁。发布件不可撤回（PyPI 不可覆盖、镜像会缓存），所以门禁
#     必须在这里强制，不能只靠发版前人工记得跑 ci.yml。顺序 gates → release →
#     publish-pypi 保证门禁红时既不建 Release 也不上传 PyPI。
#   * 门禁清单与 ci.yml 的 gates job 保持同款（离线部分）；live 审计需 Secrets，
#     不放这里；
#   * MCP registry 上架仍是人工步骤（JWT 短时效、每次发布前重新登录），
#     流程见 MAINTAINERS.md。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  gates:
    # 发版前质量门禁：与 ci.yml 的 gates job 同款离线检查。
    # 目的不是替代 CI（tag 通常来自已绿的 main），而是防「tag 打在未过 CI 的
    # 提交上」或「CI 绿了但生成物/目录在发版分支上已漂移」这两类事故——发布件
    # 一旦上传 PyPI 不可撤回，代价远高于多跑两分钟。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Tag matches __version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(python -c 'import re,pathlib;print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("src/wmshare/__init__.py").read_text(encoding="utf-8")).group(1))')"
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 __version__ $declared 不一致，拒绝发版"
            exit 1
          fi
      - name: Install
        run: pip install -e ".[dev]"
      - name: Leak gate (internal markers / secrets)
        run: python tools/check_leak.py
      - name: Catalog contract + anti-fabrication gate
        run: python tools/validate_catalog.py
      - name: Metric taxonomy drift gate
        run: python tools/extract_metric_taxonomy.py --check
      - name: Metric taxonomy contract (1:1 with metrics.json)
        run: python tools/validate_metric_taxonomy.py
      - name: Unit ledger contract
        run: python tools/validate_units.py
      - name: Version consistency gate (six sources)
        run: python tools/check_version.py --check
      - name: License consistency gate (BSD-3-Clause)
        run: python tools/check_license.py --check
      - name: Guard coverage floor (no regression)
        run: python tools/guard_coverage.py --min 0.2473
      - name: Generated docs drift gate
        run: |
          python tools/gen_api_docs.py --check
          python tools/gen_typed_api.py --check
          python tools/gen_openapi.py --check
          python tools/gen_llms.py --check
          python tools/gen_indicators.py --check
          python tools/gen_errors.py --check
          python tools/gen_data_calendar.py --check
          python tools/gen_server.py --check
          python tools/gen_changelog_feed.py --check
      - name: Static types
        run: python -m mypy
      - name: Offline test suite
        run: pytest -q --cov-branch

  release:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Extract release notes from CHANGELOG
        run: |
          python tools/changelog_section.py "${GITHUB_REF_NAME#v}" > /tmp/release-notes.md
          wc -l /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md \
            --verify-tag

  publish-pypi:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: python -m twine upload --non-interactive --skip-existing dist/*
